<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S - Mobile Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow-bg"></div>

<header>
  <h1>J.A.R.V.I.S</h1>
  <p>MOBILE EDITION • CORE ACTIVE</p>
</header>

<main>
  <div class="core-wrapper">
    <div class="core">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="center"></div>
      <div class="center-dot"></div>
    </div>
    <div class="pulse-wave"></div>
    <div class="pulse-wave w2"></div>
  </div>
  <p class="core-text"><span class="live-dot"></span> CORE ACTIVE • ONLINE</p>

  <div class="status">
    <h2>SYSTEM STATUS</h2>
    <div class="row"><span>AI CORE</span><b class="on">● ONLINE</b></div>
    <div class="row"><span>NETWORK</span><b class="on">● ONLINE</b></div>
    <div class="row"><span>VOICE</span><b class="off" id="voiceStatus">○ STANDBY</b></div>
    <div class="row"><span>MEMORY</span><b class="on">● 84% FREE</b></div>
  </div>

  <div class="chat" id="chat">
    <div class="msg ai">J.A.R.V.I.S: Systems online, Boss. How may I assist?</div>
  </div>
</main>

<div class="input-area">
  <input type="text" id="msg" placeholder="Ask J.A.R.V.I.S..." autocomplete="off">
  <button id="send">SEND</button>
</div>

<script src="script.js"></script>
</body>
</html>
